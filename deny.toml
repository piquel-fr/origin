[advisories]
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip = [
  { crate = "syn@2.0.119", reason = "divan-macros and tracing-attributes have not moved to syn 3 yet" },
]

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
