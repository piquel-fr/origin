[workspace]
resolver = "3"
members = [
  "apps/origin-src",
  "crates/origin-client",
  "crates/origin-shared",
  "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The minimum supported Rust version. CI builds with it; keep it in line with
# rust-toolchain.toml until they need to differ.
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/piquel-fr/origin"

[workspace.dependencies]
# Internal
origin-client = { version = "0.1.0", path = "crates/origin-client" }
origin-shared = { version = "0.1.0", path = "crates/origin-shared" }
origin-src    = { version = "0.1.0", path = "apps/origin-src"       }

# External
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
divan = "0.1.21"
jiff = "0.2.38"
# No TLS yet: remotes are plain HTTP in the prototype.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "net", "rt-multi-thread", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-axum = "0.3.0"
zstd = "0.14.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Line tables keep file and line numbers in backtraces but drop the variable
# and type info that makes up most of a debug build's output.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
strip = "symbols"

# Benchmarks measure what ships.
[profile.bench]
inherits = "release"
