[workspace]
resolver = "3"
members = [
  "apps/origin-src",
  "crates/origin-client",
  "crates/origin-platform",
  "crates/origin-shared",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The minimum supported Rust version. CI builds with it; keep it in line with
# rust-toolchain.toml until they need to differ.
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/piquel-fr/origin"

[workspace.dependencies]
# Internal
origin-client = { version = "0.1.0", path = "crates/origin-client" }
origin-platform = { version = "0.1.0", path = "crates/origin-platform" }
origin-shared = { version = "0.1.0", path = "crates/origin-shared" }

# External
blake3 = "1.8.7"
divan = "0.1.21"
ed25519-dalek = { version = "3.0.0", default-features = false }
getrandom = "0.4.3"
reflink-copy = "0.1.30"
# Only in origin-platform. The version and features reflink-copy uses on Linux.
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
zstd = "0.14.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Line tables keep file and line numbers in backtraces but drop the variable
# and type info that makes up most of a debug build's output.
[profile.dev]
debug = "line-tables-only"

# Dependencies build without debug info: their backtrace frames are rarely
# needed, and it keeps debug builds smaller and faster.
[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = "symbols"

# Benchmarks measure what ships.
[profile.bench]
inherits = "release"
